<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZmovie — SAMORN Fuck</title>
  <style>
    *{box-sizing:border-box;font-family:Segoe UI,sans-serif;}
    body{max-width:900px;margin:20px auto;padding:0 15px;background:#0f111a;color:#e6edf7;}
    h1{color:#73d2ff;text-align:center;}
    .panel{background:#181b2a;padding:18px;border-radius:10px;}
    .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center;}
    input,button{padding:8px 12px;border-radius:6px;border:none;font-size:15px;}
    input{background:#23273b;color:#fff;border:1px solid #343a56;}
    button{background:#2584e2;color:#fff;font-weight:bold;cursor:pointer;}
    button:disabled{background:#344260;cursor:not-allowed;}
    pre{background:#0b0d14;padding:12px;border-radius:8px;max-height:400px;overflow:auto;}
    .stat{display:flex;gap:20px;margin:8px 0;}
    .ok{color:#5be389;}.err{color:#ff6b81;}
  </style>
</head>
<body>
<h1>🎬 EZmovie — SAMORN FUCK 1.0</h1>
<div class="panel">
  <div class="row">
    <label>ลิงก์หมวดหมู่:</label>
    <input type="text" id="web_movie" style="width:450px" placeholder="https://ezmovie.live/movies/...">
  </div>
  <div class="row">
    <label>หน้าที่ต้องการดึง:</label>
    <input type="number" id="page_num" min="1" value="1" style="width:80px">
    <button id="btnGo">▶️ เริ่มทำงาน</button>
  </div>
  <div class="stat">
    <span>สำเร็จ: <b id="cntOk" class="ok">0</b></span>
    <span>ไม่สำเร็จ: <b id="cntErr" class="err">0</b></span>
  </div>
  <pre id="log"></pre>
  <div class="row" id="dlArea" style="display:none;margin-top:10px;">
    <button id="btnW3u">📄 บันทึก W3U</button>
    <button id="btnM3u">📺 บันทึก M3U</button>
  </div>
</div>

<script>
const PROXY = "https://ezmovies.samornnovember.workers.dev/?url=";
const BASE = "https://ezmovie.live";
const LOGO = BASE + "/build/web/ez-movie/img/ez-movie-logo.png";

let jseries = {name:"", author:" อัพเดต ", info:"EZmovie v2.0-SECRET", image:LOGO, groups:[], stations:[]};
let totalOk=0, totalErr=0;

const elLog = document.getElementById("log");
const elBtn = document.getElementById("btnGo");
const elWeb = document.getElementById("web_movie");
const elPage = document.getElementById("page_num");
const elCntOk = document.getElementById("cntOk");
const elCntErr = document.getElementById("cntErr");
const elDlArea = document.getElementById("dlArea");
const elBtnW3u = document.getElementById("btnW3u");
const elBtnM3u = document.getElementById("btnM3u");

function log(t){ elLog.textContent += t+"\n"; elLog.scrollTop = elLog.scrollHeight; }
function unquote(s){ return decodeURIComponent(s||""); }
function saveFile(n,b){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([b],{type:"text/plain;charset=utf-8"})); a.download=n; a.click(); URL.revokeObjectURL(a.href); }
function saveW3u(){ saveFile("EZmovie.w3u", JSON.stringify(jseries,null,2)); }
function saveM3u(){
  let out="#EXTM3U\n#EXT-X-PLAYLIST-TYPE:VOD\n#EXT-X-VERSION:3\n\n";
  for(let s of jseries.stations) out += `#EXTINF:-1,${s.name} ${s.info||""}\n${s.url}\n\n`;
  for(let g of jseries.groups) for(let s of g.stations) out += `#EXTINF:-1 group-title="${g.name}",${s.name} ${s.info||""}\n${s.url}\n\n`;
  saveFile("EZmovie.m3u", out.trim());
}

async function startScrape(){
  const url = elWeb.value.trim();
  const page = parseInt(elPage.value)||1;
  if(!url||page<1) return alert("กรอกข้อมูลให้ถูกต้อง!");

  elBtn.disabled=true; elLog.textContent=""; elDlArea.style.display="none";
  totalOk=totalErr=0; jseries.groups=[]; jseries.stations=[]; elCntOk.textContent=elCntErr.textContent="0";

  log(`🚀 เริ่มดึง หน้าที่ ${page} ...`);
  try{
    const res = await fetch(`${PROXY}${encodeURIComponent(url)}&page=${page}`);
    const data = await res.json();
    if(data.error) throw new Error(data.error);

    jseries.name = data.name;
    jseries.stations = data.stations||[];
    jseries.groups = data.groups||[];
    totalOk = jseries.stations.length + jseries.groups.reduce((s,g)=>s+g.stations.length,0);

    log(`✅ เสร็จสิ้น! หนังเดี่ยว:${jseries.stations.length} | ซีรีส์:${jseries.groups.length} เรื่อง | รวม:${totalOk}`);
    elDlArea.style.display="block";
  }catch(err){
    log(`❌ ผิดพลาด: ${err.message}`);
  }
  elBtn.disabled=false;
}

elBtn.addEventListener("click",startScrape);
elBtnW3u.addEventListener("click",saveW3u);
elBtnM3u.addEventListener("click",saveM3u);
</script>
</body>
</html>
