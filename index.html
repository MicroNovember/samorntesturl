<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZmovie ดึงลิงก์ (แก้ปัญหา localhost)</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { max-width:950px; margin:20px auto; padding:0 15px; background:#0f111a; color:#e6edf7; }
    h1 { color:#73d2ff; text-align:center; font-size:1.4rem; }
    .panel { background:#181b2a; padding:18px; border-radius:10px; margin-bottom:15px; }
    .form-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    input,button { padding:9px 14px; border-radius:6px; border:none; font-size:15px; }
    input { background:#23273b; color:#fff; border:1px solid #343a56; }
    button { background:#2584e2; color:white; cursor:pointer; font-weight:bold; }
    button:disabled { background:#344260; cursor:not-allowed; }
    pre { background:#0b0d14; padding:12px; border-radius:8px; overflow:auto; max-height:380px; font-size:13px; line-height:1.4; }
    .stat { display:flex; gap:20px; margin:8px 0; flex-wrap:wrap; font-weight:500; }
    .ok { color:#5be389; } .err { color:#ff6b81; }
    .dl-group { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
    .dl-group button { background:#27a179; }
  </style>
</head>
<body>
<h1>🎬 EZmovie ดึงลิงก์ (แก้ปัญหา localhost 403)</h1>
<div class="panel">
  <div class="form-row">
    <label>ลิงก์หมวดหมู่:</label>
    <input type="text" id="catUrl" value="https://ezmovie.live/movies/หนัง-av-japan" style="width:450px">
  </div>
  <div class="form-row">
    <label>เริ่มหน้า:</label><input type="number" id="startPage" min="1" value="1" style="width:70px">
    <label>ถึงหน้า:</label><input type="number" id="endPage" min="1" value="24" style="width:70px">
    <button id="btnGo" onclick="startScrape()">▶️ เริ่มทำงาน</button>
  </div>
  <div class="stat">
    <span>สำเร็จ: <b id="cntOk" class="ok">0</b></span>
    <span>ไม่พบลิงก์: <b id="cntErr" class="err">0</b></span>
  </div>
  <pre id="log"></pre>
  <div class="dl-group" id="dlArea" style="display:none">
    <button onclick="saveFile(f_w3u, JSON.stringify(jseries,null,2))">📄 บันทึก W3U</button>
    <button onclick="saveFile(f_m3u, buildM3U())">📺 บันทึก M3U</button>
  </div>
</div>

<script>
// ✅ ตั้งค่าคงที่ — ห้ามแก้เป็น localhost เด็ดขาด
const PROXY = "https://ezmovies.samornnovember.workers.dev/?url=";
const BASE_REAL = "https://ezmovie.live";
const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/98.0.4758.102 Safari/537.36";
const LOGO = BASE_REAL + "/build/web/ez-movie/img/ez-movie-logo.png";

let jseries = {name:"", author:" อัพเดต ", info:"EZmovie v1.03", image:"", groups:[], stations:[]};
let f_w3u = "", f_m3u = "", baseUrl = "";
let totalOk = 0, totalErr = 0;

const elLog = document.getElementById("log"), elBtn = document.getElementById("btnGo");
const elCatUrl = document.getElementById("catUrl"), elStart = document.getElementById("startPage"), elEnd = document.getElementById("endPage");
const elCntOk = document.getElementById("cntOk"), elCntErr = document.getElementById("cntErr");
const elDlArea = document.getElementById("dlArea");

function log(t){ elLog.textContent += t + "\n"; elLog.scrollTop = elLog.scrollHeight; }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function saveFile(n,b){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([b],{type:"text/plain;charset=utf-8"})); a.download=n; a.click(); URL.revokeObjectURL(a.href); }
function urlBase(u){ const p=new URL(u); return p.protocol+"//"+p.hostname+"/"; }
function unquote(s){ return decodeURIComponent(s); }

// ✅ ฟังก์ชันแก้ลิงก์ — ตัดทิ้ง localhost เปลี่ยนเป็นโดเมนจริง
function fixUrl(u){
  if(!u) return "";
  if(u.includes("localhost")){
    return u.replace(/^https?:\/\/[^\/]+/, BASE_REAL);
  }
  if(u.startsWith("/")) return BASE_REAL + u;
  return u;
}

async function safeFetch(url, extraHeaders={}){
  const fixed = fixUrl(url); // ✅ แก้ลิงก์ก่อนส่งเสมอ
  try{
    return await fetch(PROXY + encodeURIComponent(fixed), {
      headers: { "User-Agent": UA, "Referer": BASE_REAL + "/", ...extraHeaders },
      redirect: "manual", timeout: 25000
    });
  }catch{ return null; }
}

async function getLink(x){
  const h = await safeFetch(x);
  if(!h) return ["no link", null];
  if(h.headers.get("location")) return [h.headers.get("location"), h];
  return ["no location", h];
}

function getJscFromS(soup){
  const scripts = soup.querySelectorAll('script[type="text/javascript"]');
  if(!scripts.length) return [];
  const jsc = "eval" + scripts[scripts.length-1].textContent.split("eval").pop();
  return jsc.split("|").filter(a=>a.length===32).map(a=>"https://ezmovie4k.com/video/"+a).reverse().slice(1);
}

async function getPlink(x){
  const fixed = fixUrl(x);
  const wr = urlBase(fixed);
  if(fixed.includes("ezmovie4k.com")){
    const whash = fixed.split("/").pop();
    const res = await safeFetch(`https://ezmovie4k.com/player/index.php?data=${whash}&do=getVideo`, {
      "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8", "X-Requested-With": "XMLHttpRequest"
    });
    if(!res) return [null, wr];
    const j = JSON.parse((await res.text()).replace(/\\/g,""));
    const plink = j.videoSource;
    const hp = await safeFetch(plink);
    return [hp ? (await hp.text()).trim().split("\n").filter(l=>l&&!l.startsWith("#")).pop() : null, wr];
  }else{
    const res = await safeFetch(fixed);
    if(!res) return [null, wr];
    const txt = await res.text();
    const m = txt.match(/vhash,\s*({[\s\S]*?}),\s*false/);
    if(!m) return [null, wr];
    const j = JSON.parse(m[1].replace(/\\/g,""));
    const jvd = j.videoDisk||"";
    const plink = `${wr}${j.videoUrl}?s=${j.videoServer}&d=${jvd}`;
    const hp = await safeFetch(plink);
    return [hp ? (await hp.text()).trim().split("\n").filter(l=>l&&!l.startsWith("#")).pop() : null, wr];
  }
}

function buildM3U(){
  let out = "#EXTM3U\n#EXT-X-PLAYLIST-TYPE:VOD\n#EXT-X-VERSION:3\n#EXT-X-TARGETDURATION:10\n\n";
  for(const g of jseries.groups){
    for(const s of g.stations){
      out += `#EXTINF:-1 group-title="${g.name}",${s.name} ${s.info||""}\n${s.url}\n\n`;
    }
  }
  return out.trim();
}

async function startScrape(){
  const web_movie = fixUrl(elCatUrl.value.trim());
  const start_page = parseInt(elStart.value)||1;
  const end_page = parseInt(elEnd.value)||1;
  if(!web_movie || start_page<1 || end_page<start_page) return alert("กรอกข้อมูลให้ถูกต้อง!");

  elBtn.disabled=true; elLog.textContent=""; elDlArea.style.display="none";
  totalOk=totalErr=0; jseries.groups=[];
  elCntOk.textContent=elCntErr.textContent="0";
  baseUrl = urlBase(web_movie);

  const path = new URL(web_movie).pathname;
  const fname = unquote(path.replace(/^\/+|\/+$/g,"").split("/").pop()||"index");
  f_w3u = `EZmovie_${fname}.w3u`;
  f_m3u = `EZmovie_${fname}.m3u`;

  const now = new Date();
  const month = ['','ม.ค.','ก.พ.','มี.ค','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  jseries.author += `${now.getDate()} ${month[now.getMonth()+1]} ${now.getFullYear()+543} ${now.toTimeString().slice(0,5)}`;
  jseries.image = LOGO;

  const home = await safeFetch(web_movie);
  if(!home) return log("❌ โหลดหน้าหลักไม่ได้"), elBtn.disabled=false;
  const soup = new DOMParser().parseFromString(await home.text(),"text/html");
  jseries.name = soup.querySelector("h1")?.textContent.trim()||fname;

  log(`\n🚀 เริ่มดึงข้อมูล หน้า ${start_page} ถึง ${end_page} ...\n`);

  for(let page_num=start_page; page_num<=end_page; page_num++){
    const page_link = page_num===1 ? web_movie : `${web_movie}?page=${page_num}`;
    log("=".repeat(70));
    log(`📄 กำลังประมวลผลหน้า [${page_num}/${end_page}]`);

    jseries.groups.push({name:`หน้าที่ ${page_num}`, image:LOGO, stations:[]});
    const group_index = jseries.groups.length-1;

    const res = await safeFetch(page_link);
    if(!res){ log("❌ โหลดหน้าไม่ได้"); continue; }
    const doc = new DOMParser().parseFromString(await res.text(),"text/html");
    const panel = doc.querySelector(".-row-inner-wrapper-item");
    if(!panel){ log("❌ ไม่พบรายการในหน้านี้"); continue; }
    const items = panel.querySelectorAll(".-item-inner-wrapper");
    log(`   📋 พบ ${items.length} รายการ`);

    for(let i=0; i<items.length; i++){
      const box = items[i];
      const pname = box.querySelector("h2")?.textContent.trim()||`ไม่ระบุ ${i+1}`;
      const ppic = fixUrl(box.querySelector("img")?.dataset.src||"");
      log(`   [${i+1}] ${pname}`);

      let purl = box.querySelector("a")?.dataset.url || box.querySelector("a")?.href || "";
      purl = fixUrl(purl).replace("/_ajax","");
      if(!purl){ log("      ❌ ไม่เจอลิงก์"); totalErr++; continue; }

      const dres = await safeFetch(purl);
      if(!dres){ totalErr++; elCntErr.textContent=totalErr; continue; }
      const ds = new DOMParser().parseFromString(await dres.text(),"text/html");
      const isSeries = ds.querySelector(".x-series-thumbnail");
      let added = false;

      if(!isSeries){
        const switcher = ds.querySelector(".-player-switcher-wrapper");
        if(switcher){
          const dframe = fixUrl(ds.querySelector("iframe")?.src||"").replace(/amp;/g,"");
          for(const lang of switcher.querySelectorAll("button")){
            const plang = lang.textContent.trim();
            const frameUrl = dframe + "&type=" + lang.dataset.playerTypeTarget;
            let plink = null;
            try{
              const [redir] = await getLink(frameUrl);
              if(redir && !redir.includes("youtube")) [plink] = await getPlink(redir);
            }catch{
              const r = await safeFetch(frameUrl);
              if(r){ const m=(await r.text()).match(/file:\s*'(.+?)'/s); plink=m?.[1]; }
            }
            if(plink){
              log(`      ✅ [${plang}] ได้ลิงก์`);
              jseries.groups[group_index].stations.push({name:pname, info:plang, image:ppic, url:plink});
              totalOk++; elCntOk.textContent=totalOk; added=true;
            }
          }
        }
        if(!added){
          const sframe = fixUrl(ds.querySelector("iframe")?.src||"").replace(/amp;/g,"");
          const fres = await safeFetch(sframe);
          if(fres){
            const fs = new DOMParser().parseFromString(await fres.text(),"text/html");
            let purl_l = getJscFromS(fs), plink=null;
            for(const jid of purl_l){ [plink] = await getPlink(jid); if(plink) break; }
            if(!plink){ const m=(await fs.textContent).match(/file:\s*'(.+?)'/s); plink=m?.[1]; }
            if(plink){
              log(`      ✅ ได้ลิงก์`);
              jseries.groups[group_index].stations.push({name:pname, info:"", image:ppic, url:plink});
              totalOk++; elCntOk.textContent=totalOk;
            }
          }
        }
      }
      await sleep(1200+Math.random()*800);
    }
  }

  log("\n"+"=".repeat(70));
  log("✅ เสร็จสิ้น!");
  log(`สำเร็จ: ${totalOk} | ไม่ได้: ${totalErr}`);
  elDlArea.style.display="block"; elBtn.disabled=false;
}
</script>
</body>
</html>
