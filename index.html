<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZmovie — แก้ลำดับดึงลิงก์</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { max-width:950px; margin:20px auto; padding:0 15px; background:#0f111a; color:#e6edf7; }
    h1 { color:#73d2ff; text-align:center; font-size:1.4rem; }
    .panel { background:#181b2a; padding:18px; border-radius:10px; margin-bottom:15px; }
    .form-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    input,button { padding:9px 14px; border-radius:6px; border:none; font-size:15px; }
    input { background:#23273b; color:#fff; border:1px solid #343a56; }
    button { background:#2584e2; color:white; cursor:pointer; font-weight:bold; }
    button:disabled { background:#344260; cursor:not-allowed; }
    pre { background:#0b0d14; padding:12px; border-radius:8px; overflow:auto; max-height:420px; font-size:13px; line-height:1.4; }
    .stat { display:flex; gap:20px; margin:8px 0; flex-wrap:wrap; font-weight:500; }
    .ok { color:#5be389; } .err { color:#ff6b81; }
    .dl-group { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
    .dl-group button { background:#27a179; }
  </style>
</head>
<body>
<h1>🎬 EZmovie — แก้ลำดับดึงลิงก์ตรงต้นฉบับ</h1>
<div class="panel">
  <div class="form-row">
    <label>ลิงก์หมวดหมู่:</label>
    <input type="text" id="web_movie" value="https://ezmovie.live/movies/หนัง-av-japan" style="width:480px">
  </div>
  <div class="form-row">
    <label>เริ่มหน้า:</label><input type="number" id="start_page" min="1" value="1" style="width:70px">
    <label>ถึงหน้า:</label><input type="number" id="end_page" min="1" value="24" style="width:70px">
    <button id="btnGo" onclick="startScrape()">▶️ เริ่มทำงาน</button>
  </div>
  <div class="stat">
    <span>สำเร็จ: <b id="cntOk" class="ok">0</b></span>
    <span>ไม่สำเร็จ: <b id="cntErr" class="err">0</b></span>
  </div>
  <pre id="log"></pre>
  <div class="dl-group" id="dlArea" style="display:none">
    <button onclick="saveW3U()">📄 บันทึก W3U</button>
    <button onclick="saveM3U()">📺 บันทึก M3U</button>
  </div>
</div>

<script>
const PROXY = "https://ezmovies.samornnovember.workers.dev/?url=";
const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/98.0.4758.102 Safari/537.36";
const BASE = "https://ezmovie.live";
const LOGO = BASE + "/build/web/ez-movie/img/ez-movie-logo.png";

let jseries = {name:"", author:" อัพเดต ", info:"EZmovie v1.05", image:"", groups:[], stations:[]};
let f_w3u = "", f_m3u = "", referer = "", totalOk = 0, totalErr = 0;

const elLog = document.getElementById("log"), elBtn = document.getElementById("btnGo");
const elWeb = document.getElementById("web_movie"), elStart = document.getElementById("start_page"), elEnd = document.getElementById("end_page");
const elCntOk = document.getElementById("cntOk"), elCntErr = document.getElementById("cntErr");
const elDlArea = document.getElementById("dlArea");

function log(t){ elLog.textContent += t + "\n"; elLog.scrollTop = elLog.scrollHeight; }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function unquote(s){ return decodeURIComponent(s||""); }
function urlBase(u){ try{ const p=new URL(u); return `${p.protocol}//${p.hostname}/`; }catch{return BASE+"/";} }

// ✅ แก้ลิงก์อย่างปลอดภัย — ไม่ให้เกิด // ซ้ำ / โดเมนผสม
function fixUrl(u){
  if(!u) return ""; u=u.trim();
  if(u.startsWith("http")){
    if(u.includes("github.io")||u.includes("localhost")) try{ const p=new URL(u); u=p.pathname; }catch{return "";}
    else return u;
  }
  return BASE.replace(/\/+$/,"") + "/" + u.replace(/^\/+/,"");
}

async function safeFetch(url, extra={}){
  const fixed=fixUrl(url); if(!fixed) return null;
  try{ return await fetch(PROXY+encodeURIComponent(fixed),{headers:{"User-Agent":UA,"Referer":referer,...extra},redirect:"manual",timeout:20000}); }
  catch{return null;}
}

// ============ ตรงตาม Python ต้นฉบับ 100% ============
async function get_link(x){
  const h=await safeFetch(x); if(!h)return["no link",null];
  if(h.headers.get("Location")) return [h.headers.get("Location"),h];
  return ["no location",h];
}

function get_jsc_from_s(soup){
  if(!soup)return[];
  const q=soup.querySelectorAll('script[type="text/javascript"]'); if(!q.length)return[];
  const t=q[q.length-1]?.textContent||""; if(!t)return[];
  return ("eval"+t.split("eval").pop()).split("|").filter(a=>a?.length===32).map(a=>"https://ezmovie4k.com/video/"+a).reverse().slice(1);
}

async function get_plink(x){
  let wr=urlBase(x);
  if(x.includes("ezmovie4k.com")){
    const h=x.split("/").pop()||""; if(!h)return[null,wr];
    const r=await safeFetch(`https://ezmovie4k.com/player/index.php?data=${h}&do=getVideo`,{"Content-Type":"application/x-www-form-urlencoded; charset=UTF-8","X-Requested-With":"XMLHttpRequest"});
    if(!r?.ok)return[null,wr];
    try{ const j=JSON.parse((await r.text()).replace(/\\/g,"")); const hp=await safeFetch(j.videoSource); return hp?.ok?[(await hp.text()).split("\n").filter(l=>l.trim()).pop()+".m3u":null,wr]; }
    catch{return[null,wr];}
  }else{
    const r=await safeFetch(x); if(!r?.ok)return[null,wr];
    const m=(await r.text()).match(/vhash,\s*({[\s\S]*?}),\s*false/); if(!m)return[null,wr];
    try{ const j=JSON.parse(m[1].replace(/\\/g,"")); const pl=`${wr.replace(/\/$/,"")}${j.videoUrl}?s=${j.videoServer}&d=${j.videoDisk||""}`; const hp=await safeFetch(pl); return hp?.ok?[(await hp.text()).split("\n").filter(l=>l.trim()).pop()+".m3u":null,wr]; }
    catch{return[null,wr];}
  }
}

function saveW3U(){ saveFile(f_w3u,JSON.stringify(jseries,null,1)); }
function saveM3U(){ let o="#EXTM3U\n#EXT-X-PLAYLIST-TYPE:VOD\n#EXT-X-VERSION:3\n\n"; jseries.groups.forEach(g=>g.stations.forEach(s=>o+=`#EXTINF:-1 group-title="${g.name}",${s.name} ${s.info||""}\n${s.url}\n\n`)); saveFile(f_m3u,o.trim()); }
function saveFile(n,b){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([b],{type:"text/plain;charset=utf-8"})); a.download=n; a.click(); URL.revokeObjectURL(a.href); }

async function startScrape(){
  const web_movie=fixUrl(elWeb.value.trim()); const start_page=parseInt(elStart.value)||1,end_page=parseInt(elEnd.value)||1;
  if(!web_movie||start_page<1||end_page<start_page)return alert("กรอกข้อมูลให้ถูกต้อง!");
  elBtn.disabled=true; elLog.textContent=""; elDlArea.style.display="none"; totalOk=totalErr=0; jseries.groups=[]; elCntOk.textContent=elCntErr.textContent="0"; referer=urlBase(web_movie);

  const path=new URL(web_movie).pathname.replace(/^\/+|\/+$/g,""); const fname=unquote(path.split("/").pop()||"index");
  f_w3u=`EZmovie_${fname}.w3u`; f_m3u=`EZmovie_${fname}.m3u`;
  const now=new Date(),m=['','ม.ค.','ก.พ.','มี.ค','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  jseries.author+=` ${now.getDate()} ${m[now.getMonth()+1]} ${now.getFullYear()+543} ${now.toTimeString().slice(0,5)}`; jseries.image=LOGO;

  const hres=await safeFetch(web_movie); if(!hres?.ok)return log("❌ โหลดหมวดไม่ได้"),elBtn.disabled=false;
  jseries.name=new DOMParser().parseFromString(await hres.text(),"text/html").querySelector("h1")?.textContent.trim()||fname;
  log(`\n🚀 เริ่ม หน้า ${start_page}-${end_page}\n`);

  for(let p=start_page;p<=end_page;p++){
    const pl=p===1?web_movie:`${web_movie}?page=${p}`; log("=".repeat(70)); log(`📄 หน้า ${p}`);
    jseries.groups.push({name:`หน้าที่ ${p}`,image:LOGO,stations:[]}); const gi=jseries.groups.length-1;
    const pres=await safeFetch(pl); if(!pres?.ok){log("❌ โหลดหน้าไม่ได้");continue;}
    const ps=new DOMParser().parseFromString(await pres.text(),"text/html");
    const boxs=ps.querySelectorAll(".-item-inner-wrapper")||[]; log(`   📋 พบ ${boxs.length} รายการ`);

    for(let i=0;i<boxs.length;i++){
      const b=boxs[i]; const pname=b.querySelector("h2")?.textContent.trim()||`ไม่ระบุ ${i+1}`;
      const ppic=fixUrl(b.querySelector("img")?.dataset.src||""); log(`  [${i+1}] ${pname}`);

      // ✅ ดึงลิงก์ถูกต้อง — ไม่เคยเก็บ/เรียก bbk100.xyz ซ้ำ
      let raw=b.querySelector("a")?.dataset.url||b.querySelector("a")?.href||"";
      const purl=fixUrl(raw.replace("/_ajax","")); if(!purl){log("    ❌ ไม่มีลิงก์");totalErr++;continue;}
      log(`  🔗 ${unquote(purl)}`);

      const dres=await safeFetch(purl); if(!dres?.ok){totalErr++;continue;}
      const ds=new DOMParser().parseFromString(await dres.text(),"text/html");
      const mtype=ds.querySelector(".x-series-thumbnail")?0:1; let wr=urlBase(purl),added=false;

      if(mtype){
        const sw=ds.querySelector(".x-movie-show-info")?.querySelector(".-player-switcher-wrapper");
        if(sw){
          const dframe=fixUrl(ds.querySelector("iframe")?.src||"").replace(/amp;/g,"");
          for(const lang of sw.querySelectorAll("button")){
            const plang=lang.textContent.trim(); const fu=`${dframe}&type=${lang.dataset.playerTypeTarget||""}`;
            let plink=null;
            try{ const [rd]=await get_link(fu); if(rd&&!rd.includes("youtube"))[plink,wr]=await get_plink(rd); }
            catch{ const r=await safeFetch(fu); if(r?.ok){const m=(await r.text()).match(/file:\s*'(.+?)'/s);plink=m?.[1];} }
            if(plink){ log(`    ✅ [${plang}] ได้`); jseries.groups[gi].stations.push({name:pname,info:plang,image:ppic,url:plink,referer:wr}); totalOk++; elCntOk.textContent=totalOk; added=true; }
          }
        }
        if(!added){
          const sframe=fixUrl(ds.querySelector("iframe")?.src||"").replace(/amp;/g,"");
          if(sframe){
            const r=await safeFetch(sframe); if(r?.ok){
              const s=new DOMParser().parseFromString(await r.text(),"text/html");
              let purl_l=get_jsc_from_s(s),plink=null;
              for(const jid of purl_l){[plink,wr]=await get_plink(jid);if(plink)break;}
              if(!plink){const m=(await r.text()).match(/file:\s*'(.+?)'/s);plink=m?.[1];}
              if(plink){ log(`    ✅ ได้`); jseries.groups[gi].stations.push({name:pname,info:"",image:ppic,url:plink,referer:wr}); totalOk++; elCntOk.textContent=totalOk; }
            }
          }
        }
      }else{
        const eps=ds.querySelectorAll(".x-series-thumbnail .-slick-item")||[];
        for(let j=0;j<eps.length;j++){
          const ebox=eps[j]; const ename=ebox.querySelector(".-title")?.textContent.trim()||"";
          const ename2=ename.includes("ตอนที่")?ename:`ตอนที่ ${ename}`;
          const eurl=fixUrl(ebox.querySelector("a")?.href||""); log(`    📌 [${j+1}] ${ename2}`);
          const eres=await safeFetch(eurl); if(!eres?.ok||(await eres.text()).includes("Resource not found"))continue;
          const es=new DOMParser().parseFromString(await eres.text(),"text/html"); let plink=null,plang="";
          const sw=es.querySelector(".-player-switcher-wrapper");
          if(sw){
            const dframe=fixUrl(es.querySelector("iframe")?.src||"").replace(/amp;/g,"");
            for(const lang of sw.querySelectorAll("button")){
              plang=lang.textContent.trim(); const fu=`${dframe}&type=${lang.dataset.playerTypeTarget||""}`;
              try{const [rd]=await get_link(fu);if(rd&&!rd.includes("youtube"))[plink]=await get_plink(rd);}
              catch{const r=await safeFetch(fu);if(r?.ok){const m=(await r.text()).match(/file:\s*'(.+?)'/s);plink=m?.[1];}}
              if(plink)break;
            }
          }else{
            const dframe=fixUrl(es.querySelector("iframe")?.src||"").replace(/amp;/g,"");
            const r=await safeFetch(dframe); if(r?.ok){
              const s=new DOMParser().parseFromString(await r.text(),"text/html"); wr=urlBase(dframe);
              const purl_l=get_jsc_from_s(s); for(const jid of purl_l){[plink,wr]=await get_plink(jid);if(plink)break;}
              if(!plink){const m=(await r.text()).match(/file:\s*'(.+?)'/s);plink=m?.[1];}
            }
          }
          if(plink) jseries.groups[gi].stations.push({name:ename2,info:`[${plang}]`,image:ppic,url:plink,referer:wr});
        }
      }
      await sleep(1200+Math.random()*800);
    }
  }
  log("\n✅ เสร็จ! สำเร็จ:"+totalOk+" | ไม่ได้:"+totalErr); elDlArea.style.display="block"; elBtn.disabled=false;
}
</script>
</body>
</html>
