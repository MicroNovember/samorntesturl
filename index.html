<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>24HD M3U Generator - SAMORN olo</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
    body{max-width:750px;margin:30px auto;padding:0 15px;line-height:1.6;background:#121212;color:#e0e0e0}
    h1{color:#ffffff;margin-bottom:20px;font-size:24px}
    .card{background:#1e1e1e;padding:18px;border-radius:10px;margin-bottom:15px;border:1px solid #333}
    label{display:block;margin:10px 0 5px;font-weight:500;color:#bbb}
    input{width:100%;padding:10px 12px;border:1px solid #444;border-radius:6px;font-size:15px;background:#2d2d2d;color:#fff}
    input:focus{outline:none;border-color:#2563eb}
    .row{display:flex;gap:12px;margin:10px 0}
    .row div{flex:1}
    button{width:100%;padding:12px 18px;border:none;border-radius:6px;background:#2563eb;color:#fff;font-size:15px;cursor:pointer;margin-top:12px;font-weight:bold;transition:background 0.2s}
    button:hover{background:#1d4ed8}
    button:disabled{background:#4b5563;cursor:not-allowed}
    #status{margin:12px 0;color:#9ca3af;white-space:pre-wrap;font-size:14px}
    pre{background:#18181b;color:#a1a1aa;padding:12px;border-radius:6px;overflow-x:auto;border:1px solid #27272a;margin-top:10px;font-size:13px}
    .small{font-size:13px;color:#888;margin-top:5px}
    .helper-box{background:#172554;border:1px solid #1e40af;padding:12px;border-radius:6px;margin-bottom:15px;font-size:13px;color:#93c5fd}
    .helper-box a{color:#bfdbfe;text-decoration:underline}
  </style>
</head>
<body>

<h1>📺 24HD M3U Generator - SAMORN olo</h1>

<div class="helper-box">
  💡 <strong>แนะนำ:</strong> สามารถค้นหารายการหมวดหมู่ที่ต้องการได้จากเว็บไซต์หลักโดยตรง: <a href="https://www.24hd.vip" target="_blank">24hd.vip</a>
</div>

<div class="card">
  <label>🔗 URL หมวดหมู่</label>
  <input type="text" id="catUrl" value="https://www.24hd.vip/category/netflix/" placeholder="https://www.24hd.vip/category/...">
  <div class="small">รองรับทุกหมวดหมู่จาก 24hd.vip (จำกัดการดึงสูงสุดไม่เกิน 3 หน้าต่อครั้งเพื่อความเสถียร)</div>

  <div class="row">
    <div>
      <label>หน้าเริ่ม (1)</label>
      <input type="number" id="start" value="1" min="1" max="15">
    </div>
    <div>
      <label>หน้าสิ้นสุด (สูงสุด 3 หน้า)</label>
      <input type="number" id="end" value="3" min="1" max="15">
    </div>
  </div>

  <button id="btnRun" onclick="gen()">🚀 เริ่มสร้างรายการ</button>
</div>

<p id="status"></p>
<div id="result" style="display:none">
  <button onclick="copy()" style="background:#059669;margin-bottom:10px;">📋 คัดลอก M3U</button>
  <pre id="out"></pre>
</div>

<script>
const WORKER_URL = "https://ezmovies.samornnovember.workers.dev/";

const btn = document.getElementById("btnRun");
const status = document.getElementById("status");
const result = document.getElementById("result");
const out = document.getElementById("out");

let cooldownTimer = null;

async function gen(){
  const url = document.getElementById("catUrl").value.trim();
  const s = parseInt(document.getElementById("start").value) || 1;
  const e = parseInt(document.getElementById("end").value) || 1;

  if(!url.startsWith("https://www.24hd.vip/")){
    status.textContent = "❌ ต้องเป็นลิงก์จาก 24hd.vip เท่านั้น";
    return;
  }

  // กำหนดเงื่อนไขจำกัดไม่เกิน 3 หน้าต่อการกด 1 ครั้ง
  if ((e - s + 1) > 3) {
    status.textContent = "⚠️ เพื่อป้องกันระบบล่มและโดนบล็อก IP กรุณากำหนดช่วงหน้าไม่เกินครั้งละ 3 หน้าครับ";
    return;
  }

  if (s > e) {
    status.textContent = "❌ หน้าเริ่มต้องน้อยกว่าหรือเท่ากับหน้าสิ้นสุด";
    return;
  }

  btn.disabled = true;
  let countdown = 5; // หน่วงเวลาปุ่มป้องกันการกดรัวๆ (Cooldown 5 วินาที)
  
  status.textContent = `⏳ กำลังประมวลผลข้อมูลจากเซิร์ฟเวอร์...`;
  result.style.display = "none";

  try{
    const res = await fetch(`${WORKER_URL}?url=${encodeURIComponent(url)}&start=${s}&end=${e}`);
    const txt = await res.text();
    if(!res.ok) throw txt;

    out.textContent = txt;
    result.style.display = "block";
    if(txt.startsWith("#EXTM3U")){
      status.textContent = "✅ เสร็จสิ้น! สามารถคัดลอก M3U ไปใช้งานได้เลย";
    }else{
      status.textContent = "⚠️ แจ้งเตือน:\n" + txt;
    }
  }catch(err){
    status.textContent = "❌ ผิดพลาด: " + err;
  } finally {
    // ระบบ Cooldown ป้องกันการกดรัวๆ ซ้ำซ้อนจากผู้ใช้
    btn.textContent = `⏳ กรุณารอ (${countdown}s)`;
    cooldownTimer = setInterval(() => {
      countdown--;
      if (countdown > 0) {
        btn.textContent = `⏳ กรุณารอ (${countdown}s)`;
      } else {
        clearInterval(cooldownTimer);
        btn.disabled = false;
        btn.textContent = "🚀 เริ่มสร้างรายการ";
      }
    }, 1000);
  }
}

function copy(){
  navigator.clipboard.writeText(out.textContent);
  alert("✅ คัดลอกเรียบร้อยแล้ว");
}
</script>

</body>
</html>
