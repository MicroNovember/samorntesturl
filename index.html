<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>24HD M3U Generator (ไม่ใช้ Python)</title>
  <style>
    body{font-family:sans-serif;max-width:700px;margin:30px auto;padding:0 20px}
    .box{background:#f6f8fa;padding:15px;border-radius:8px;margin:10px 0}
    button,input{padding:8px 12px;font-size:16px}
    pre{background:#fff;padding:10px;border-radius:6px;overflow-x:auto}
  </style>
</head>
<body>
  <h1>📺 สร้างรายการ 24HD (Pure JS + Cloudflare)</h1>
  <div class="box">
    <label>หน้าเริ่ม: <input type="number" id="s" value="1" min="1"></label>
    <label>หน้าสิ้นสุด: <input type="number" id="e" value="1" min="1"></label>
    <button onclick="go()">🚀 เริ่ม</button>
  </div>
  <p id="st"></p>
  <div id="out" style="display:none">
    <button onclick="copy()">📋 คัดลอก M3U</button>
    <pre id="m3u"></pre>
  </div>

<script>
const API = "/"; // ใส่ลิงก์ Worker ถ้าไม่ได้ตั้งโดเมนเดียวกัน

async function go(){
  const s = document.getElementById("s").value;
  const e = document.getElementById("e").value;
  const st = document.getElementById("st");
  const out = document.getElementById("out");
  st.textContent = "⏳ กำลังดึงข้อมูล...";
  out.style.display = "none";
  try{
    const res = await fetch(`${API}?start=${s}&end=${e}`);
    const txt = await res.text();
    if(!txt.startsWith("#EXTM3U")) throw txt;
    document.getElementById("m3u").textContent = txt;
    out.style.display = "block";
    st.textContent = "✅ เสร็จสิ้น";
  }catch(err){
    st.textContent = "❌ ผิดพลาด: " + err;
  }
}
function copy(){
  navigator.clipboard.writeText(document.getElementById("m3u").textContent);
  alert("คัดลอกแล้ว!");
}
</script>
</body>
</html>
