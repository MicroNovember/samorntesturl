<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZmovie ดึงลิงก์ (แก้ GitHub 404+CORS)</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { max-width:950px; margin:20px auto; padding:0 15px; background:#0f111a; color:#e6edf7; }
    h1 { color:#73d2ff; text-align:center; font-size:1.4rem; }
    .panel { background:#181b2a; padding:18px; border-radius:10px; margin-bottom:15px; }
    .form-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    input,button { padding:9px 14px; border-radius:6px; border:none; font-size:15px; }
    input { background:#23273b; color:#fff; border:1px solid #343a56; }
    button { background:#2584e2; color:white; cursor:pointer; font-weight:bold; }
    button:disabled { background:#344260; cursor:not-allowed; }
    pre { background:#0b0d14; padding:12px; border-radius:8px; overflow:auto; max-height:380px; font-size:13px; line-height:1.4; }
    .stat { display:flex; gap:20px; margin:8px 0; flex-wrap:wrap; font-weight:500; }
    .ok { color:#5be389; } .err { color:#ff6b81; }
    .dl-group { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
    .dl-group button { background:#27a179; }
  </style>
</head>
<body>
<h1>🎬 EZmovie ดึงลิงก์ (แก้ GitHub 404+CORS)</h1>
<div class="panel">
  <div class="form-row">
    <label>ลิงก์หมวดหมู่:</label>
    <input type="text" id="catUrl" value="https://ezmovie.live/movies/หนัง-av-japan" style="width:450px">
  </div>
  <div class="form-row">
    <label>เริ่มหน้า:</label><input type="number" id="startPage" min="1" value="1" style="width:70px">
    <label>ถึงหน้า:</label><input type="number" id="endPage" min="1" value="24" style="width:70px">
    <button id="btnGo" onclick="startScrape()">▶️ เริ่มทำงาน</button>
  </div>
  <div class="stat">
    <span>สำเร็จ: <b id="cntOk" class="ok">0</b></span>
    <span>ไม่พบ/หมดอายุ: <b id="cntDead" class="err">0</b></span>
  </div>
  <pre id="log"></pre>
  <div class="dl-group" id="dlArea" style="display:none">
    <button onclick="saveFile(f_w3u, JSON.stringify(jseries,null,2))">📄 บันทึก W3U</button>
    <button onclick="saveFile(f_m3u, buildM3U())">📺 บันทึก M3U</button>
  </div>
</div>

<script>
// ✅ ห้ามแก้ — ใช้แค่ ezmovie.live เท่านั้น
const PROXY = "https://ezmovies.samornnovember.workers.dev/?url=";
const BASE_REAL = "https://ezmovie.live";
const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36";
const LOGO = BASE_REAL + "/build/web/ez-movie/img/ez-movie-logo.png";

let jseries = {name:"", author:" อัพเดต ", info:"EZmovie v1.05", image:"", groups:[], stations:[]};
let f_w3u = "", f_m3u = "", baseUrl = "";
let totalOk = 0, totalDead = 0;

const elLog = document.getElementById("log"), elBtn = document.getElementById("btnGo");
const elCatUrl = document.getElementById("catUrl"), elStart = document.getElementById("startPage"), elEnd = document.getElementById("endPage");
const elCntOk = document.getElementById("cntOk"), elCntDead = document.getElementById("cntDead");
const elDlArea = document.getElementById("dlArea");

function log(t){ elLog.textContent += t + "\n"; elLog.scrollTop = elLog.scrollHeight; }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function saveFile(n,b){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([b],{type:"text/plain;charset=utf-8"})); a.download=n; a.click(); URL.revokeObjectURL(a.href); }
function urlBase(u){ try{ const p=new URL(fixUrl(u)); return p.protocol+"//"+p.hostname+"/"; }catch{return BASE_REAL+"/";} }
function unquote(s){ return decodeURIComponent(s||""); }

// ✅ ตัดทิ้งทุกโดเมนที่ไม่ใช่ ezmovie.live
function fixUrl(u){
  if(!u) return ""; u=u.trim();
  if(u.includes("github.io") || u.includes("localhost")) return u.replace(/^https?:\/\/[^\/]+/, BASE_REAL);
  if(u.startsWith("/")) return BASE_REAL+u;
  return u;
}
function safeMatch(str,rgx,def=null){ return str?.match(rgx)||def; }

async function safeFetch(url, extra={}){
  const fixed=fixUrl(url); if(!fixed) return null;
  try{
    return await fetch(PROXY+encodeURIComponent(fixed),{
      headers:{"User-Agent":UA,"Referer":BASE_REAL+"/",...extra},timeout:20000
    });
  }catch{return null;}
}
async function getLink(x){ const h=await safeFetch(x); return h?.headers.get("location")?[h.headers.get("location"),h]:["no location",h]; }
function getJscFromS(s){ const q=s?.querySelectorAll?.('script[type="text/javascript"]')||[]; if(!q.length)return[]; const t=q[q.length-1]?.textContent||""; return t?("eval"+t.split("eval").pop()).split("|").filter(a=>a?.length===32).map(a=>"https://ezmovie4k.com/video/"+a).reverse().slice(1):[]; }

async function getPlink(x){
  const fixed=fixUrl(x); const wr=urlBase(fixed);
  if(fixed.includes("ezmovie4k.com")){
    const h=fixed.split("/").pop(); if(!h)return[null,wr];
    const r=await safeFetch(`https://ezmovie4k.com/player/index.php?data=${h}&do=getVideo`,{"Content-Type":"application/x-www-form-urlencoded; charset=UTF-8","X-Requested-With":"XMLHttpRequest"});
    if(!r?.ok)return[null,wr]; try{ const j=JSON.parse((await r.text()).replace(/\\/g,"")); if(!j?.videoSource)return[null,wr]; const hp=await safeFetch(j.videoSource); return hp?.ok?[(await hp.text()).split("\n").filter(l=>l.trim()&&!l.startsWith("#")).pop()||null,wr]:[null,wr]; }catch{return[null,wr];}
  }
  const r=await safeFetch(fixed); if(!r?.ok)return[null,wr]; const m=safeMatch(await r.text(),/vhash,\s*({[\s\S]*?}),\s*false/); if(!m)return[null,wr];
  try{ const j=JSON.parse(m[1].replace(/\\/g,"")); const pl=`${wr}${j.videoUrl}?s=${j.videoServer}&d=${j.videoDisk||""}`; const hp=await safeFetch(pl); return hp?.ok?[(await hp.text()).split("\n").filter(l=>l.trim()&&!l.startsWith("#")).pop()||null,wr]:[null,wr]; }catch{return[null,wr];}
}
function buildM3U(){ let o="#EXTM3U\n#EXT-X-PLAYLIST-TYPE:VOD\n#EXT-X-VERSION:3\n\n"; jseries.groups.forEach(g=>g.stations.forEach(s=>o+=`#EXTINF:-1 group-title="${g.name}",${s.name} ${s.info||""}\n${s.url}\n\n`)); return o.trim(); }

async function startScrape(){
  const web=fixUrl(elCatUrl.value.trim()); const s=parseInt(elStart.value)||1, e=parseInt(elEnd.value)||1;
  if(!web||s<1||e<s)return alert("กรอกข้อมูลให้ถูกต้อง!");
  elBtn.disabled=true; elLog.textContent=""; elDlArea.style.display="none"; totalOk=totalDead=0; jseries.groups=[];
  elCntOk.textContent=elCntDead.textContent="0"; baseUrl=urlBase(web);
  const fn=unquote(new URL(web).pathname.replace(/^\/+|\/+$/g,"").split("/").pop()||"index"); f_w3u=`EZmovie_${fn}.w3u`; f_m3u=`EZmovie_${fn}.m3u`;
  const now=new Date(), m=['','ม.ค.','ก.พ.','มี.ค','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  jseries.author+=`${now.getDate()} ${m[now.getMonth()+1]} ${now.getFullYear()+543} ${now.toTimeString().slice(0,5)}`; jseries.image=LOGO;
  const h=await safeFetch(web); if(!h?.ok)return log("❌ โหลดหมวดไม่ได้"),elBtn.disabled=false;
  jseries.name=new DOMParser().parseFromString(await h.text(),"text/html").querySelector("h1")?.textContent.trim()||fn;
  log(`\n🚀 เริ่ม หน้า ${s}-${e}\n`);

  for(let p=s;p<=e;p++){
    const pl=p===1?web:`${web}?page=${p}`; log("=".repeat(60)); log(`📄 หน้า ${p}`);
    jseries.groups.push({name:`หน้าที่ ${p}`,image:LOGO,stations:[]}); const gi=jseries.groups.length-1;
    const r=await safeFetch(pl); if(!r?.ok){log("❌ โหลดหน้าไม่ได้");continue;}
    const d=new DOMParser().parseFromString(await r.text(),"text/html");
    const items=d.querySelectorAll(".-item-inner-wrapper")||[]; log(`   📋 พบ ${items.length} รายการ`);

    for(let i=0;i<items.length;i++){
      const b=items[i]; const n=b.querySelector("h2")?.textContent.trim()||`ไม่ระบุ ${i+1}`;
      const img=fixUrl(b.querySelector("img")?.dataset.src||""); log(`   [${i+1}] ${n}`);
      let u=b.querySelector("a")?.dataset.url||b.querySelector("a")?.href||""; u=fixUrl(u).replace("/_ajax","");
      if(!u){log("      ❌ ไม่มีลิงก์");totalDead++;continue;}
      const dr=await safeFetch(u); if(!dr?.ok){log("      ❌ หมดอายุ/404");totalDead++;continue;}
      const ds=new DOMParser().parseFromString(await dr.text(),"text/html");
      const sw=ds.querySelector(".-player-switcher-wrapper"); let ok=false;
      if(sw){
        const f=fixUrl(ds.querySelector("iframe")?.src||"").replace(/amp;/g,"");
        for(const btn of sw.querySelectorAll("button")){
          const lng=btn.textContent.trim(), fu=f+"&type="+(btn.dataset.playerTypeTarget||"");
          let lnk=null; try{ const [rd]=await getLink(fu); if(rd&&!rd.includes("youtube"))[lnk]=await getPlink(rd); }catch{const x=await safeFetch(fu);if(x?.ok){const m=safeMatch(await x.text(),/file:\s*'(.+?)'/s);lnk=m?.[1];}}
          if(lnk){ log(`      ✅ [${lng}] ได้`); jseries.groups[gi].stations.push({name:n,info:lng,image:img,url:lnk}); totalOk++; elCntOk.textContent=totalOk; ok=true; }
        }
      }
      if(!ok){
        const f=fixUrl(ds.querySelector("iframe")?.src||"").replace(/amp;/g,"");
        if(f){ const fr=await safeFetch(f); if(fr?.ok){ const fs=new DOMParser().parseFromString(await fr.text(),"text/html"); let pl=null; for(const x of getJscFromS(fs)){[pl]=await getPlink(x);if(pl)break;} if(!pl){const m=safeMatch(await fs.textContent||"",/file:\s*'(.+?)'/s);pl=m?.[1];} if(pl){log(`      ✅ ได้`);jseries.groups[gi].stations.push({name:n,info:"",image:img,url:pl});totalOk++;elCntOk.textContent=totalOk;}else{log(`      ⚠️ ไม่พบลิงก์`);totalDead++;elCntDead.textContent=totalDead;} } }
      }
      await sleep(1200+Math.random()*800);
    }
  }
  log("\n✅ เสร็จ! สำเร็จ:"+totalOk+" | ไม่ได้:"+totalDead); elDlArea.style.display="block"; elBtn.disabled=false;
}
</script>
</body>
</html>
