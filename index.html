<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>24HD M3U Generator - แก้ไขแล้ว</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
    body{max-width:750px;margin:30px auto;padding:0 15px;line-height:1.6}
    h1{color:#222;margin-bottom:20px}
    .card{background:#f8f9fa;padding:18px;border-radius:10px;margin-bottom:15px;border:1px solid #eee}
    label{display:block;margin:10px 0 5px;font-weight:500}
    input{width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:6px;font-size:15px}
    .row{display:flex;gap:12px;margin:10px 0}
    .row div{flex:1}
    button{padding:9px 18px;border:none;border-radius:6px;background:#2563eb;color:#fff;font-size:15px;cursor:pointer;margin-top:8px}
    button:disabled{background:#94a3b8;cursor:not-allowed}
    #status{margin:12px 0;color:#444;white-space:pre-wrap}
    pre{background:#fff;padding:12px;border-radius:6px;overflow-x:auto;border:1px solid #eee;margin-top:10px}
    .small{font-size:13px;color:#666;margin-top:5px}
  </style>
</head>
<body>

<h1>📺 สร้างรายการ M3U จาก 24HD</h1>

<div class="card">
  <label>🔗 URL หมวดหมู่</label>
  <input type="text" id="catUrl" value="https://www.24hd.vip/category/netflix/" placeholder="https://www.24hd.vip/category/...">
  <div class="small">รองรับทุกหมวดหมู่จาก 24hd.vip</div>

  <div class="row">
    <div>
      <label>หน้าเริ่ม</label>
      <input type="number" id="start" value="1" min="1">
    </div>
    <div>
      <label>หน้าสิ้นสุด</label>
      <input type="number" id="end" value="1" min="1">
    </div>
  </div>

  <button id="btnRun" onclick="gen()">🚀 เริ่มสร้างรายการ</button>
</div>

<p id="status"></p>
<div id="result" style="display:none">
  <button onclick="copy()">📋 คัดลอก M3U</button>
  <pre id="out"></pre>
</div>

<script>
// 👉 ใส่ลิงก์ Worker ของคุณ
const WORKER_URL = "https://ezmovies.samornnovember.workers.dev/";

const btn = document.getElementById("btnRun");
const status = document.getElementById("status");
const result = document.getElementById("result");
const out = document.getElementById("out");

async function gen(){
  const url = document.getElementById("catUrl").value.trim();
  const s = document.getElementById("start").value;
  const e = document.getElementById("end").value;

  if(!url.startsWith("https://www.24hd.vip/")){
    status.textContent = "❌ ต้องเป็นลิงก์จาก 24hd.vip เท่านั้น";
    return;
  }

  btn.disabled = true;
  status.textContent = "⏳ กำลังดึงข้อมูล... อาจใช้เวลา 5-15 วินาที";
  result.style.display = "none";

  try{
    const res = await fetch(`${WORKER_URL}?url=${encodeURIComponent(url)}&start=${s}&end=${e}`);
    const txt = await res.text();
    if(!res.ok) throw txt;

    out.textContent = txt;
    result.style.display = "block";
    if(txt.startsWith("#EXTM3U")){
      status.textContent = "✅ เสร็จสิ้น! คัดลอกไปใช้งานได้เลย";
    }else{
      status.textContent = "⚠️ แจ้งเตือน:\n" + txt;
    }
  }catch(err){
    status.textContent = "❌ ผิดพลาด: " + err;
  }finally{
    btn.disabled = false;
  }
}

function copy(){
  navigator.clipboard.writeText(out.textContent);
  alert("✅ คัดลอกเรียบร้อยแล้ว");
}
</script>

</body>
</html>
