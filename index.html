<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZmovie — แก้ครบถ้วน</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { max-width:950px; margin:20px auto; padding:0 15px; background:#0f111a; color:#e6edf7; }
    h1 { color:#73d2ff; text-align:center; font-size:1.4rem; }
    .panel { background:#181b2a; padding:18px; border-radius:10px; margin-bottom:15px; }
    .form-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    input,button { padding:9px 14px; border-radius:6px; border:none; font-size:15px; }
    input { background:#23273b; color:#fff; border:1px solid #343a56; }
    button { background:#2584e2; color:white; cursor:pointer; font-weight:bold; }
    button:disabled { background:#344260; cursor:not-allowed; }
    pre { background:#0b0d14; padding:12px; border-radius:8px; overflow:auto; max-height:420px; font-size:13px; line-height:1.4; }
    .stat { display:flex; gap:20px; margin:8px 0; flex-wrap:wrap; font-weight:500; }
    .ok { color:#5be389; } .err { color:#ff6b81; } .warn { color:#ffc15e; }
    .dl-group { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
    .dl-group button { background:#27a179; }
  </style>
</head>
<body>
<h1>🎬 EZmovie — แก้ครบถ้วน ตรงต้นฉบับ</h1>
<div class="panel">
  <div class="form-row">
    <label>ลิงก์หมวดหมู่:</label>
    <input type="text" id="web_movie" value="https://ezmovie.live/movies/หนัง-av-japan" style="width:480px">
  </div>
  <div class="form-row">
    <label>เริ่มหน้า:</label><input type="number" id="start_page" min="1" value="1" style="width:70px">
    <label>ถึงหน้า:</label><input type="number" id="end_page" min="1" value="24" style="width:70px">
    <button id="btnGo" onclick="startScrape()">▶️ เริ่มทำงาน</button>
  </div>
  <div class="stat">
    <span>สำเร็จ: <b id="cntOk" class="ok">0</b></span>
    <span>ไม่สำเร็จ: <b id="cntErr" class="err">0</b></span>
  </div>
  <pre id="log"></pre>
  <div class="dl-group" id="dlArea" style="display:none">
    <button onclick="saveW3U()">📄 บันทึก W3U</button>
    <button onclick="saveM3U()">📺 บันทึก M3U</button>
  </div>
</div>

<script>
// ============ ตั้งค่าคงที่ — ห้ามแก้ ============
const PROXY = "https://ezmovies.samornnovember.workers.dev/?url=";
const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/98.0.4758.102 Safari/537.36";
const BASE = "https://ezmovie.live";
const LOGO = BASE + "/build/web/ez-movie/img/ez-movie-logo.png";

let jseries = {name:"", author:" อัพเดต ", info:"EZmovie v1.04", image:"", groups:[], stations:[]};
let f_w3u = "", f_m3u = "", referer = "", totalOk = 0, totalErr = 0;

const elLog = document.getElementById("log"), elBtn = document.getElementById("btnGo");
const elWeb = document.getElementById("web_movie"), elStart = document.getElementById("start_page"), elEnd = document.getElementById("end_page");
const elCntOk = document.getElementById("cntOk"), elCntErr = document.getElementById("cntErr");
const elDlArea = document.getElementById("dlArea");

// ============ ฟังก์ชันช่วยพื้นฐาน ============
function log(t){ elLog.textContent += t + "\n"; elLog.scrollTop = elLog.scrollHeight; }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function unquote(s){ return decodeURIComponent(s||""); }
function urlBase(u){ try{ const p=new URL(u); return `${p.protocol}//${p.hostname}/`; }catch{return BASE+"/";} }

// ✅ แก้จุดสำคัญ: รวมลิงก์ให้ถูกต้อง — ไม่ให้เกิด // ซ้ำ / โดเมนผสม
function fixUrl(u){
  if(!u) return "";
  u = u.trim();
  // ถ้าเป็นลิงก์เต็มแต่เป็นโดเมนผิด → เอาแค่ path มาต่อโดเมนถูก
  if(u.startsWith("http")){
    if(u.includes("github.io") || u.includes("localhost")){
      try{ const p=new URL(u); u=p.pathname+p.search+p.hash; }catch{return "";}
    }else{
      return u; // ถ้าเป็นโดเมนถูกต้อง ปล่อยผ่าน
    }
  }
  // ต่อ path ให้ถูก ตัด / ซ้ำออก
  return BASE.replace(/\/+$/,"") + "/" + u.replace(/^\/+/,"");
}

async function safeFetch(url, extra={}){
  const fixed = fixUrl(url);
  if(!fixed) return null;
  try{
    return await fetch(PROXY + encodeURIComponent(fixed), {
      headers:{"User-Agent":UA,"Referer":referer,...extra}, redirect:"manual", timeout:20000
    });
  }catch{ return null; }
}

// ============ ตรงตาม Python ต้นฉบับ ============
async function get_link(x){
  const h = await safeFetch(x);
  if(!h) return ["no link", null];
  if(h.headers.get("Location")) return [h.headers.get("Location"), h];
  return ["no location", h];
}

function get_jsc_from_s(soup){
  if(!soup) return [];
  const scripts = soup.querySelectorAll('script[type="text/javascript"]');
  if(!scripts.length) return [];
  const last = scripts[scripts.length-1];
  if(!last||!last.textContent) return [];
  const jsc = "eval" + last.textContent.split("eval").pop();
  return jsc.split("|").filter(a=>a&&a.length===32).map(a=>"https://ezmovie4k.com/video/"+a).reverse().slice(1);
}

async function get_plink(x){
  let wr = urlBase(x);
  if(x.includes("ezmovie4k.com")){
    const whash = x.split("/").pop()||"";
    if(!whash) return [null, wr];
    const res = await safeFetch(`https://ezmovie4k.com/player/index.php?data=${whash}&do=getVideo`,{
      "Content-Type":"application/x-www-form-urlencoded; charset=UTF-8","X-Requested-With":"XMLHttpRequest"
    });
    if(!res||!res.ok) return [null,wr];
    try{
      const jdata = JSON.parse((await res.text()).replace(/\\/g,""));
      const hp = await safeFetch(jdata.videoSource);
      if(!hp||!hp.ok) return [null,wr];
      const lines = (await hp.text()).split("\n").filter(l=>l.trim());
      return [lines.length?lines.pop()+".m3u":null,wr];
    }catch{return [null,wr];}
  }else{
    const res = await safeFetch(x);
    if(!res||!res.ok) return [null,wr];
    const txt = await res.text();
    const m = txt.match(/vhash,\s*({[\s\S]*?}),\s*false/);
    if(!m) return [null,wr];
    try{
      const jdata = JSON.parse(m[1].replace(/\\/g,""));
      const jvd = jdata.videoDisk===null?"":jdata.videoDisk;
      const plink = `${wr.replace(/\/$/,"")}${jdata.videoUrl}?s=${jdata.videoServer}&d=${jvd}`;
      const hp = await safeFetch(plink);
      if(!hp||!hp.ok) return [null,wr];
      const lines = (await hp.text()).split("\n").filter(l=>l.trim());
      return [lines.length?lines.pop()+".m3u":null,wr];
    }catch{return [null,wr];}
  }
}

// ============ บันทึกไฟล์ ============
function saveW3U(){ saveFile(f_w3u, JSON.stringify(jseries,null,1)); }
function saveM3U(){
  let out="#EXTM3U\n#EXT-X-PLAYLIST-TYPE:VOD\n#EXT-X-VERSION:3\n#EXT-X-TARGETDURATION:10\n\n";
  for(const g of jseries.groups||[]) for(const s of g.stations||[]) out+=`#EXTINF:-1 group-title="${g.name}",${s.name} ${s.info||""}\n${s.url}\n\n`;
  saveFile(f_m3u, out.trim());
}
function saveFile(n,b){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([b],{type:"text/plain;charset=utf-8"})); a.download=n; a.click(); URL.revokeObjectURL(a.href); }

// ============ ทำงานหลัก ============
async function startScrape(){
  const web_movie = fixUrl(elWeb.value.trim());
  const start_page = parseInt(elStart.value)||1;
  const end_page = parseInt(elEnd.value)||1;
  if(!web_movie||start_page<1||end_page<start_page) return alert("กรอกข้อมูลให้ถูกต้อง!");

  elBtn.disabled=true; elLog.textContent=""; elDlArea.style.display="none";
  totalOk=totalErr=0; jseries.groups=[];
  elCntOk.textContent=elCntErr.textContent="0";
  referer = urlBase(web_movie);

  const path = new URL(web_movie).pathname.replace(/^\/+|\/+$/g,"");
  const fname = unquote(path.split("/").pop()||"index");
  f_w3u = `EZmovie_${fname}.w3u`;
  f_m3u = `EZmovie_${fname}.m3u`;

  const now = new Date();
  const month = ['','ม.ค.','ก.พ.','มี.ค','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  jseries.author += ` ${now.getDate()} ${month[now.getMonth()+1]} ${now.getFullYear()+543} ${now.toTimeString().slice(0,5)}`;
  jseries.image = LOGO;

  const hres = await safeFetch(web_movie);
  if(!hres||!hres.ok) return log("❌ โหลดหน้าหลักไม่ได้"), elBtn.disabled=false;
  jseries.name = new DOMParser().parseFromString(await hres.text(),"text/html").querySelector("h1")?.textContent.trim()||fname;

  log(`\n🚀 เริ่มดึงข้อมูล หน้า ${start_page} ถึง ${end_page} ...\n`);

  for(let page_num=start_page; page_num<=end_page; page_num++){
    const page_link = page_num===1 ? web_movie : `${web_movie}?page=${page_num}`;
    log("=".repeat(70));
    log(`📄 หน้า [${page_num}/${end_page}] : ${unquote(page_link)}`);

    jseries.groups.push({name:`หน้าที่ ${page_num}`,image:LOGO,stations:[]});
    const gi = jseries.groups.length-1;

    const pres = await safeFetch(page_link);
    if(!pres||!pres.ok){ log("❌ โหลดหน้าไม่ได้"); continue; }
    const ps = new DOMParser().parseFromString(await pres.text(),"text/html");
    const panel = ps.querySelector(".-row-inner-wrapper-item");
    if(!panel){ log("❌ ไม่พบรายการ"); continue; }
    const boxs = panel.querySelectorAll(".-item-inner-wrapper")||[];
    log(`   📋 พบ ${boxs.length} รายการ`);

    for(let i=0; i<boxs.length; i++){
      const box = boxs[i];
      const pname = box.querySelector("h2")?.textContent.trim()||`ไม่ระบุ ${i+1}`;
      const ppic = fixUrl(box.querySelector("img")?.dataset.src||"");
      log(`  [${i+1}] ${pname}`);

      // ✅ แก้จุดดึงลิงก์รายการ — ป้องกันโดเมนผสม
      let raw = box.querySelector("a")?.dataset.url || box.querySelector("a")?.getAttribute("href") || "";
      raw = raw.replace("/_ajax","");
      const purl = fixUrl(raw);
      if(!purl){ log("    ❌ ไม่เจอลิงก์"); totalErr++; continue; }
      log(`  🔗 ${unquote(purl)}`);

      const dres = await safeFetch(purl);
      if(!dres||!dres.ok){ totalErr++; elCntErr.textContent=totalErr; continue; }
      const ds = new DOMParser().parseFromString(await dres.text(),"text/html");
      const mtype = ds.querySelector(".x-series-thumbnail") ? 0 : 1;
      let wr = urlBase(purl);
      let added = false;

      // หนังเดี่ยว
      if(mtype){
        const sw = ds.querySelector(".x-movie-show-info")?.querySelector(".-player-switcher-wrapper");
        if(sw){
          const dframe = fixUrl(ds.querySelector("iframe")?.src||"").replace(/amp;/g,"");
          for(const lang of sw.querySelectorAll("button")){
            const plang = lang.textContent.trim();
            const fu = `${dframe}&type=${lang.dataset.playerTypeTarget||""}`;
            let plink=null;
            try{
              const [rd,h] = await get_link(fu);
              if(rd&&!rd.includes("youtube")) [plink,wr] = await get_plink(rd);
            }catch{
              const r = await safeFetch(fu);
              if(r&&r.ok){ const m=(await r.text()).match(/file:\s*'(.+?)'/s); plink=m?.[1]; }
            }
            if(plink){
              log(`    ✅ [${plang}] ได้ลิงก์`);
              jseries.groups[gi].stations.push({name:pname,info:plang,image:ppic,url:plink,referer:wr});
              totalOk++; elCntOk.textContent=totalOk; added=true;
            }
          }
        }
        if(!added){
          const sframe = fixUrl(ds.querySelector("iframe")?.src||"").replace(/amp;/g,"");
          if(sframe){
            const r = await safeFetch(sframe);
            if(r&&r.ok){
              const s = new DOMParser().parseFromString(await r.text(),"text/html");
              let purl_l = get_jsc_from_s(s), plink=null;
              if(purl_l.length) for(const jid of purl_l){ [plink,wr] = await get_plink(jid); if(plink)break; }
              else{ const m=(await r.text()).match(/file:\s*'(.+?)'/s); plink=m?.[1]; }
              if(plink){
                log(`    ✅ ได้ลิงก์`);
                jseries.groups[gi].stations.push({name:pname,info:"",image:ppic,url:plink,referer:wr});
                totalOk++; elCntOk.textContent=totalOk;
              }
            }
          }
        }
      }else{
        // ซีรีส์
        const eps = ds.querySelectorAll(".x-series-thumbnail .-slick-item")||[];
        for(let j=0; j<eps.length; j++){
          const ebox = eps[j];
          const ename = ebox.querySelector(".-title")?.textContent.trim()||"";
          const ename2 = ename.includes("ตอนที่")?ename:`ตอนที่ ${ename}`;
          // ✅ แก้จุดดึงลิงก์ตอน — ป้องกันโดเมนผสม
          let eraw = ebox.querySelector("a")?.getAttribute("href")||"";
          const eurl = fixUrl(eraw);
          log(`    📌 [${j+1}] ${ename2}`);

          const eres = await safeFetch(eurl);
          if(!eres||!eres.ok||(await eres.text()).includes("Resource not found")) continue;
          const es = new DOMParser().parseFromString(await eres.text(),"text/html");
          let plink=null,plang="";

          const sw = es.querySelector(".-player-switcher-wrapper");
          if(sw){
            const dframe = fixUrl(es.querySelector("iframe")?.src||"").replace(/amp;/g,"");
            for(const lang of sw.querySelectorAll("button")){
              plang = lang.textContent.trim();
              const fu = `${dframe}&type=${lang.dataset.playerTypeTarget||""}`;
              try{ const [rd]=await get_link(fu); if(rd&&!rd.includes("youtube")) [plink]=await get_plink(rd); }
              catch{ const r=await safeFetch(fu); if(r&&r.ok){ const m=(await r.text()).match(/file:\s*'(.+?)'/s); plink=m?.[1]; } }
              if(plink)break;
            }
          }else{
            const dframe = fixUrl(es.querySelector("iframe")?.src||"").replace(/amp;/g,"");
            const r = await safeFetch(dframe);
            if(r&&r.ok){
              const s = new DOMParser().parseFromString(await r.text(),"text/html");
              wr = urlBase(dframe);
              const purl_l = get_jsc_from_s(s);
              if(purl_l.length) for(const jid of purl_l){ [plink,wr]=await get_plink(jid); if(plink)break; }
              else{ const m=(await r.text()).match(/file:\s*'(.+?)'/s); plink=m?.[1]; }
            }
          }
          if(plink){
            jseries.groups[gi].stations.push({name:ename2,info:`[${plang}]`,image:ppic,url:plink,referer:wr});
            totalOk++; elCntOk.textContent=totalOk;
          }
        }
      }
      await sleep(1200+Math.random()*800);
    }
  }

  log("\n"+"=".repeat(70));
  log("✅ เสร็จสิ้น!");
  log(`📊 สำเร็จ: ${totalOk} | ไม่สำเร็จ: ${totalErr}`);
  log(`⚠️ ลิงก์ bbk100.xyz หมดอายุไว — บันทึกทันทีเมื่อเสร็จ`);
  elDlArea.style.display="block"; elBtn.disabled=false;
}
</script>
</body>
</html>
